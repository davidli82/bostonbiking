name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare site files
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          mkdir _site
          cp index.html global.css map.css map.js _site/
          cp -r assets _site/
          node -e 'const fs = require("node:fs"); const token = process.env.MAPBOX_ACCESS_TOKEN; if (!token) throw new Error("MAPBOX_ACCESS_TOKEN is missing"); fs.writeFileSync("_site/config.js", "window.MAPBOX_ACCESS_TOKEN = " + JSON.stringify(token) + ";\n");'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
